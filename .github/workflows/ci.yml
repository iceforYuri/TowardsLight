# 模板库 CI:push 后验证内置 showcase 档案可构建,保证模板永远是绿的
# (部署由 Vercel 承担,此处不做)
name: 构建校验

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run frontmatter:check
      - run: npm run build
