# 模板库流水线:构建并部署展示站(内置 showcase 档案)
# 个人站的更新由个人库自行定时拉取本库最新 main,无需在此配置任何密钥
name: 构建并部署展示站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages-showcase
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # SITE_URL / SITE_BASE 可在仓库 Settings → Variables 里覆盖(如绑定自定义域名后)
      - name: 构建(内置 showcase 档案)
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://iceforyuri.github.io/TowardsLight' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/TowardsLight/' }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
